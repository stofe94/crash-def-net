# ============================================================
# Comparison protocol deforming_plate_s8_t40 — training config
# ============================================================
# Fixed training settings for comparing an architecture with the
# MeshGraphNets baseline (docs/comparison-protocol.md). As it stands, this
# file trains the baseline itself: MeshGraphNets in paper size.
#
# For a new architecture copy it (e.g. to configs/my_model_s8_t40.toml) and
# change only
#   - [model] architecture and the model's own section (here [model.meshgraphnets]),
#   - the declared variations marked "variation" below, if needed,
#   - machine settings (data loading, device, checkpointing).
# Everything else is part of the protocol; utils/check_protocol.py reports
# every difference.
#
# Dataset (~10 s, ~48 MB):
#   python -m dataset_preprocessor.export --out-dir data/deforming_plate_s8_t40 \
#       --n-train 28 --n-val 8 --n-test 4 --num-steps 50 --time-stride 8
#   -> 1,372 / 392 / 196 samples; one epoch = 686 optimizer steps at batch 2.
# Training:
#   python train/train.py --config protocols/deforming_plate_s8_t40.toml
# ============================================================

[data]
data_dir               = "data/deforming_plate_s8_t40"
num_dataloader_workers = 2       # machine setting
lazy                   = false   # machine setting

[model]
architecture            = "meshgraphnets"
residual_target         = false
world_edges             = "all"  # variation: "all" (paper) | "contact" | "self_contact_aware"
world_edge_exclude_hops = 4      # variation, with world_edges = "self_contact_aware"

[model.meshgraphnets]
# Paper (Pfaff et al. 2021): latent 128, 2 hidden layers, 15 message passing steps.
latent_size               = 128
num_mlp_layers            = 2
num_message_passing_steps = 15
aggregation               = "sum"

[training]
epochs        = 120      # budget: 120 x 686 = 82,320 optimizer steps for every model
batch_size    = 2        # paper
learning_rate = 1e-4     # paper
weight_decay  = 0.0
max_grad_norm = 1.0
seed          = 42       # fixed like the dataset: same initialization, sample order and noise
device        = "auto"   # machine setting

[training.scheduler]
# 1e-4 -> 1e-6 exponentially over the whole run (paper: over 5 M steps).
type        = "exponential"
min_lr      = 1e-6
decay_steps = "auto"

[training.rollout_validation]
# All 8 val sequences (49 steps each) every 5 epochs.
enabled          = true
every_n_epochs   = 5
max_sequences    = 8

[training.early_stopping]
enabled         = false   # no early stopping: every model trains all epochs
criteria        = ["rollout_mse"]   # model selection by the rollout MSE of the val split

[loss]
type = "mse"

[noise]
world_noise_std  = 3e-3  # paper (position noise, normal nodes)
stress_noise_std = 0.0

[scheduled_sampling]
enabled = false

[checkpointing]
checkpoint_dir = "checkpoints/protocol_s8_t40_meshgraphnets"   # machine setting
save_every     = 20
log_every      = 1
resume         = ""
