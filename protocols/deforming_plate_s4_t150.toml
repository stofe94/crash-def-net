# ============================================================
# Comparison protocol deforming_plate_s4_t150 — training config
# ============================================================
# Fixed training settings for comparing an architecture with MeshGraphNets
# on DeepMind's original splits (docs/comparison-protocol.md). As it stands,
# this file trains MeshGraphNets in its paper's configuration, with world
# edges between all pairs closer than r_W (world_edges = "all", Pfaff et al.
# 2021, Sec. 3.1). New architectures are compared with the comparable baseline,
# the same with world_edges = "self_contact_aware"; the published results of the
# paper are the original reference (docs/comparison-protocol.md, Baselines).
#
# For a new architecture copy it (e.g. to configs/my_model_s4_t150.toml) and
# change only
#   - [model] architecture and the model's own section (here [model.meshgraphnets]),
#   - the declared variations marked "variation" below (world_edges =
#     "self_contact_aware", as the comparable baseline),
#   - machine settings (data loading, micro-batches, device, checkpointing).
# Everything else is part of the protocol; check it with
#   python utils/check_protocol.py ... --protocol protocols/deforming_plate_s4_t150.toml
#
# Dataset (~10.6 GB of raw data: train, valid and test.tfrecord; export ~90 s, ~330 MB):
#   python -m dataset_preprocessor.export --out-dir data/deforming_plate_s4_t150 \
#       --source-tfrecord train.tfrecord valid.tfrecord test.tfrecord --select-seed 42 \
#       --n-train 100 --n-val 30 --n-test 20 --num-steps 100 --time-stride 4
#   -> 9,900 / 2,970 / 1,980 samples; one epoch = 1,238 optimizer steps at batch 8.
# Training:
#   python train/train.py --config protocols/deforming_plate_s4_t150.toml
# ============================================================

[data]
data_dir               = "data/deforming_plate_s4_t150"
num_dataloader_workers = 2       # machine setting
lazy                   = false   # machine setting

[model]
architecture                = "meshgraphnets"
residual_target             = false
world_edges                 = "all"  # variation: "all" (paper) | "contact" | "self_contact_aware"
world_edge_exclude_distance = 2.0    # variation, with world_edges = "self_contact_aware"

[model.meshgraphnets]
# Paper (Pfaff et al. 2021): latent 128, 2 hidden layers, 15 message passing steps.
latent_size               = 128
num_mlp_layers            = 2
num_message_passing_steps = 15
aggregation               = "sum"

[training]
epochs           = 60     # budget: 60 x 1,238 = 74,280 optimizer steps for every model
batch_size       = 8
# Machine setting: graphs per forward pass, gradients accumulated to batch_size
# (the same optimizer step). The paper-size model with world_edges = "all" keeps up
# to ~13.5 GiB of activations for the largest single graph of this dataset, so a
# 16 GB GPU takes one graph at a time; 40 GB take 2.
micro_batch_size = 1
learning_rate    = 2e-4   # 1e-4 x sqrt(8 / 2): the noise scale of batch 2 at 1e-4
weight_decay     = 0.0
max_grad_norm    = 1.0
seed             = 42     # fixed like the dataset: same initialization, sample order and noise
device           = "auto" # machine setting

[training.scheduler]
# 2e-4 -> 1e-6 along a cosine over the epochs (stepped per epoch).
type   = "cosine"
min_lr = 1e-6

[training.rollout_validation]
# All 30 val sequences (99 steps each) every 4 epochs, rolled out as one batch.
enabled          = true
every_n_epochs   = 4
max_sequences    = 30

[training.early_stopping]
enabled         = false   # no early stopping: every model trains all epochs to the end of the cosine
criteria        = ["rollout_mse"]   # model selection by the rollout MSE of the val split

[loss]
type = "mse"

[noise]
world_noise_std  = 3e-3  # paper (position noise, normal nodes)
stress_noise_std = 0.0

[scheduled_sampling]
enabled = false

[checkpointing]
checkpoint_dir = "checkpoints/protocol_s4_t150_meshgraphnets"   # machine setting
save_every     = 10
log_every      = 1
resume         = ""
