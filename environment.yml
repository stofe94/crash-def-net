# ============================================================
# CrashDefNet — conda environment
# ============================================================
#
# Create:   conda env create -f environment.yml
# Activate: conda activate crashdefnet
# Update:   conda env update -f environment.yml --prune
# Remove:   conda env remove -n crashdefnet
#
# conda -> Python, utilities
# pip   -> numpy, PyTorch, PyG, tfrecord, pyvista, matplotlib (packages with
#          compiled extensions come from one source only; mixing conda and pip
#          builds causes libstdc++ ABI conflicts on Linux/WSL, e.g. when matplotlib
#          is imported after torch, and two OpenMP runtimes on Windows, where the
#          process stops with "OMP: Error #15")
# ============================================================

name: crashdefnet
channels:
  - conda-forge

dependencies:
  - python=3.12
  - tqdm>=4.60
  - pip>=23.0
  - pip:
      # --- PyTorch CPU (GPU: change the index URL to .../whl/cu126) ---
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch>=2.6
      - torch-geometric>=2.5
      - numpy>=1.24
      - tfrecord
      - toml>=0.10
      - tzdata; sys_platform == "win32"   # time zone of the timestamps on Windows
      # --- optional: .vtu export of the rollout ---
      - pyvista>=0.43
      # --- optional: loss curves and paper comparison ---
      - matplotlib>=3.7
      # --- optional, not installed by default: LS-DYNA d3plot (conversion and reader) ---
      # - lasso-python
